name: Cargar composición desde la app

# Se dispara cuando la app abre un issue "cargar-peso" con la plantilla de la
# balanza. Suma la medición a data/composicion.json, la commitea, comenta el
# resultado y cierra el issue.

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

jobs:
  cargar:
    if: startsWith(github.event.issue.title, 'cargar-peso')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Agregar medición
        id: add
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python scripts/add_composicion.py

      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/composicion.json
          git commit -m "Composición: medición ${{ steps.add.outputs.fecha }} (desde la app)" || echo "sin cambios"
          git push

      - name: Actualizar el dashboard
        run: gh workflow run dashboard.yml --ref ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comentar y cerrar el issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const ok = "${{ job.status }}" === "success";
            const fecha = "${{ steps.add.outputs.fecha }}";
            const grasa = "${{ steps.add.outputs.grasa }}";
            const musculo = "${{ steps.add.outputs.musculo }}";
            const body = ok
              ? `✅ Medición del **${fecha}** agregada (grasa ${grasa}% · músculo ${musculo} kg). En la próxima actualización aparece en tu tarjeta de Composición. 💪\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_`
              : `⚠️ No pude leer la medición. Usá la plantilla con \`peso:\`, \`grasa:\`, \`masa_grasa:\`, \`musculo:\`.\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_`;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body,
            });
            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, state: "closed",
            });
