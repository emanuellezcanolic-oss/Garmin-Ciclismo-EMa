name: Cargar test desde la app

# Se dispara cuando la app web abre un issue "cargar-test: <clave>".
# Carga el test en Garmin (vía intervals.icu), comenta el resultado y cierra
# el issue. Así el atleta elige el test desde la app sin exponer secretos.

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  cargar:
    if: startsWith(github.event.issue.title, 'cargar-test')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Cargar test en Garmin
        id: load
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          ATHLETE_ID: i650204
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python scripts/load_test.py --from-issue

      - name: Comentar y cerrar el issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const ok = "${{ steps.load.outputs.ok }}" === "true";
            const name = "${{ steps.load.outputs.test_name }}";
            const fecha = "${{ steps.load.outputs.fecha }}";
            const body = ok
              ? `✅ **${name}** cargado para el **${fecha}**.\n\nEn unos minutos aparece en tu Garmin Connect y en el reloj. ¡A darle! 🚵\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_`
              : `⚠️ No pude cargar el test. Revisá que el título sea \`cargar-test: <clave>\` con una clave válida (lthr_30, test_20, test_5, cooper_12, sit, hrr, vt_step).\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed",
            });
