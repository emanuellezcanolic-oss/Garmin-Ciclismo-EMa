name: Cargar medidas desde la app

# Se dispara cuando la app abre un issue "cargar-medidas". Actualiza
# data/medidas.json, lo commitea, dispara el dashboard, comenta y cierra.

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

jobs:
  cargar:
    if: startsWith(github.event.issue.title, 'cargar-medidas')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Actualizar medidas
        id: upd
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python scripts/add_medida.py

      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/medidas.json
          git commit -m "Medidas: actualización desde la app (${{ steps.upd.outputs.cambios }} cambios)" || echo "sin cambios"
          git push

      - name: Actualizar el dashboard
        run: gh workflow run dashboard.yml --ref ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comentar y cerrar el issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const ok = "${{ job.status }}" === "success";
            const n = "${{ steps.upd.outputs.cambios }}";
            const body = ok
              ? `✅ Medidas actualizadas (${n} valores). En la próxima actualización aparecen en tu sección Medidas. 📏\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_`
              : `⚠️ No pude leer las medidas. Usá la plantilla \`clave: valor\` (una por línea).\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_`;
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, state: "closed" });
